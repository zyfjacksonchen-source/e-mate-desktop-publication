name: e-Mate protected performance aggregate admission
description: Verify four exact protected-main e-Mate 2.0.15 TTFT v2 evidence artifacts and sign one closed aggregate.
inputs:
  source-sha:
    description: Exact protected-main source commit bound by CI, the Desktop build, and TTFT evidence.
    required: true
  main-ci-run-id:
    description: Successful attempt-1 protected-main formal RC ci.yml workflow_dispatch run containing CI admission and both platform jobs.
    required: true
  macos-publication-mode:
    description: Exact macOS candidate ownership contract; signed requires the trusted signer run and unsigned binds darwin to formal CI, with no fallback.
    required: true
  macos-signer-run-id:
    description: Exact successful attempt-1 protected-main desktop-macos-signing.yml workflow_dispatch run owning signed candidate bytes; required only in signed mode and forbidden in unsigned mode.
    required: false
  desktop-artifact-id:
    description: Exact three-file e-mate-desktop-release artifact containing the candidate and installer bytes.
    required: true
  profile-release-run-id:
    description: Successful attempt-1 profile-release.yml run that prepared the signed Profile publication bundle.
    required: true
  profile-artifact-id:
    description: Exact e-mate-profile-native-cloudflare-publication artifact consumed by the aggregate recomputation.
    required: true
  luna-evidence-artifact-id:
    description: Exact current-run ecorex-chat evidence artifact.
    required: true
  sol-evidence-artifact-id:
    description: Exact current-run ecorex-gpt-5.6-sol evidence artifact.
    required: true
  deepseek-evidence-artifact-id:
    description: Exact current-run ecorex-deepseek-v4-pro evidence artifact.
    required: true
  doubao-evidence-artifact-id:
    description: Exact current-run ecorex-doubao-seed-2.0-pro evidence artifact.
    required: true
  signing-key-id:
    description: Existing Ed25519 key identity in the exact admitted Base trust root.
    required: true
outputs:
  artifact-path:
    description: Action-owned directory containing only the signed admission and verified evidence.
    value: ${{ steps.admit.outputs.artifact_path }}
  artifact-name:
    description: Exact e-mate-performance-admission-<sha>-attempt-1 artifact name the caller must upload.
    value: ${{ steps.admit.outputs.artifact_name }}
  admission-sha256:
    description: SHA-256 of performance-admission.json.
    value: ${{ steps.admit.outputs.admission_sha256 }}
  evidence-sha256:
    description: SHA-256 of the canonical ordered four-child evidence SHA list.
    value: ${{ steps.admit.outputs.evidence_sha256 }}
  performance-run-id:
    description: Deterministic aggregate identity binding the ordered four child run identities.
    value: ${{ steps.admit.outputs.performance_run_id }}
runs:
  using: composite
  steps:
    - id: admit
      name: Verify exact provenance and sign the passed four-model TTFT aggregate
      shell: bash
      env:
        EMATE_ACTION_REPOSITORY: ${{ github.action_repository }}
        EMATE_ACTION_REF: ${{ github.action_ref }}
        EMATE_SOURCE_SHA: ${{ inputs.source-sha }}
        EMATE_MAIN_CI_RUN_ID: ${{ inputs.main-ci-run-id }}
        EMATE_MACOS_PUBLICATION_MODE: ${{ inputs.macos-publication-mode }}
        EMATE_MACOS_SIGNER_RUN_ID: ${{ inputs.macos-signer-run-id }}
        EMATE_DESKTOP_ARTIFACT_ID: ${{ inputs.desktop-artifact-id }}
        EMATE_PROFILE_RELEASE_RUN_ID: ${{ inputs.profile-release-run-id }}
        EMATE_PROFILE_RELEASE_ARTIFACT_ID: ${{ inputs.profile-artifact-id }}
        EMATE_LUNA_EVIDENCE_ARTIFACT_ID: ${{ inputs.luna-evidence-artifact-id }}
        EMATE_SOL_EVIDENCE_ARTIFACT_ID: ${{ inputs.sol-evidence-artifact-id }}
        EMATE_DEEPSEEK_EVIDENCE_ARTIFACT_ID: ${{ inputs.deepseek-evidence-artifact-id }}
        EMATE_DOUBAO_EVIDENCE_ARTIFACT_ID: ${{ inputs.doubao-evidence-artifact-id }}
        EMATE_SIGNING_KEY_ID: ${{ inputs.signing-key-id }}
      run: |
        set -euo pipefail
        test "$(node -p 'process.versions.node.split(".")[0]')" = 24
        node "$GITHUB_ACTION_PATH/../src/performance-main.mjs"
